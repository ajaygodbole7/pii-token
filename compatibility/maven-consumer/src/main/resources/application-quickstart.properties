spring.datasource.url=jdbc:postgresql://localhost:15432/pii_demo
spring.datasource.username=pii_demo
spring.datasource.password=evaluation-only-password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

pii.application-namespace=consumer.app
pii.searchable-digests=permitted
pii.vault.address=http://localhost:18200
pii.vault.allow-insecure-http=true
pii.vault.mount=transit
pii.vault.key-name=pii-token
pii.vault.key-set-id=consumer-vault-key-set
pii.vault.current-version=k2
pii.vault.versions.k1=1
pii.vault.versions.k2=2

sample.quickstart=true
sample.vault-token=evaluation-runtime-token
